<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
      {% block title %}
        Page
      {% endblock %}

    </title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src=" {% static 'js/main.js' %}" defer></script>
</head>
<body>
  <nav>
      <a href="/">
          <span role="img" aria-label="Home" title="Home">🏠</span>
      </a> |
      <a href="/about">
          <span role="img" aria-label="About" title="About">😀</span>
      </a> |
      <a href="{% url 'posts:post_list' %}">
          <span role="img" aria-label="Posts" title="Posts">📰</span>
      </a> |
      <a href="{% url 'users:registration' %}" title="Registration">
          <span role="img" aria-label="Registration">👥</span>
      </a>
  </nav>

  <main>
    {% block content %}
    {% endblock %}
  </main>

</body>
</html>
