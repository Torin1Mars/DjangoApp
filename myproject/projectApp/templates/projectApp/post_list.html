{% extends 'projectApp/layout.html' %}

{% block title %}
Post list
{% endblock %}

{% block content%}

<section>
<h1>Page posts:</h1>

    {% for post in posts %}
        <article class="post">
            <h2>
                <a href="{%  url 'posts:page' slug=post.slug %}">
                    {{ post.title }}
                </a>
            </h2>
            <p>{{post.date}}</p>
            <p>{{post.body}}</p>
            <p><img class="banner" src="{{ post.banner.url }}" alt="Preview"></p>
        </article>
    {% endfor %}

</section>
{% endblock %}
